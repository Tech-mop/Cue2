#
# Automated tests. Runs the same scripts as a local run:
#   plain:  tests/run-tests.sh --suite plain   (C# tests, no engine)
#   engine: tests/run-tests.sh --suite engine  (headless Godot 4.7.1 .NET through GdUnit4Net)
# Locally on Windows: tests\run-tests.ps1 runs the same two suites.
# The real hardware smoke run (tests/run-hardware-smoke.ps1) is never run here.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  GODOT_VERSION: "4.7.1"
  GODOT_SHA512: "0dd41f159a358b3cf23898a8d6aa3b346bd91a574b22991bbd3bc812cd414ad1b1d7701de7124bd9818f0d52b3734a885f0edaeab9cb4b2cd1d5049171e304b8"

jobs:
  plain:
    name: Plain C# tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out (no LFS files needed)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run plain tests
        run: bash tests/run-tests.sh --suite plain

      - name: Summary
        if: always()
        run: python3 tests/test-summary.py "Plain C# tests" tests/artifacts/plain >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plain-test-results
          path: tests/artifacts/plain/
          if-no-files-found: warn

  engine:
    name: Engine tests (headless Godot)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out (LFS files fetched below, Linux only)
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Key for the Linux native libraries
        id: natives
        run: echo "key=linux64-natives-$(git lfs ls-files --long --include 'bin/linux64/**' | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore the Linux native libraries (FFmpeg, SDL3, RtMidi)
        id: natives-cache
        uses: actions/cache/restore@v4
        with:
          path: bin/linux64
          key: ${{ steps.natives.outputs.key }}

      - name: Fetch the Linux native libraries from git LFS
        if: steps.natives-cache.outputs.cache-hit != 'true'
        # When LFS cannot be fetched (for example the bandwidth quota is used up), the media
        # engine tests are skipped by the run script with a warning; the rest still run.
        continue-on-error: true
        run: git lfs pull --include "bin/linux64/**"

      - name: Check the native libraries are real files
        id: natives-check
        run: |
          if head -c 4 bin/linux64/libavcodec.so.63 | grep -q ELF; then
            echo "real=true" >> "$GITHUB_OUTPUT"
          else
            echo "real=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the Linux native libraries
        if: steps.natives-cache.outputs.cache-hit != 'true' && steps.natives-check.outputs.real == 'true'
        uses: actions/cache/save@v4
        with:
          path: bin/linux64
          key: ${{ steps.natives.outputs.key }}

      - name: Restore Godot ${{ env.GODOT_VERSION }} .NET
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64

      - name: Download Godot ${{ env.GODOT_VERSION }} .NET
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          name="Godot_v${GODOT_VERSION}-stable_mono_linux_x86_64"
          mkdir -p ~/godot
          curl -fsSL --retry 3 -o "/tmp/$name.zip" \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/$name.zip"
          echo "$GODOT_SHA512  /tmp/$name.zip" | sha512sum -c -
          unzip -q "/tmp/$name.zip" -d ~/godot
          rm "/tmp/$name.zip"

      - name: Locate Godot
        run: |
          bin="$(find ~/godot -type f -name "Godot_v${GODOT_VERSION}-stable_mono_linux.x86_64" | head -n 1)"
          test -n "$bin"
          chmod +x "$bin"
          echo "CUE2_GODOT=$bin" >> "$GITHUB_ENV"

      - name: Run engine tests
        run: bash tests/run-tests.sh --suite engine

      - name: Summary
        if: always()
        run: python3 tests/test-summary.py "Engine tests" tests/artifacts/engine >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results and timing
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: engine-test-results
          path: |
            tests/artifacts/engine/
            !tests/artifacts/engine/userdata/
          if-no-files-found: warn
